<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Eina Oficial CdS - Postgrau Govern Obert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .document-page { 
            background: white; min-height: 297mm; padding: 25mm; 
            box-shadow: 0 0 30px rgba(0,0,0,0.1); border-radius: 4px; 
            font-family: 'Arial', sans-serif; font-size: 11pt; line-height: 1.5; color: black; text-align: justify;
        }
        .yellow-field { background-color: #fef08a; padding: 0 2px; font-weight: bold; color: #854d0e; border: 1px dashed #eab308; }
        .step-active { border-bottom: 4px solid #4f46e5; color: #4f46e5; font-weight: 800; }
        .red-flag { background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 10px; margin-top: 10px; border-radius: 0 8px 8px 0; }
        .help-block { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-top: 5px; display: none; border-left: 4px solid #4f46e5; }
        .info-btn { color: #4f46e5; font-size: 10px; font-weight: bold; cursor: pointer; text-decoration: underline; margin-left: 8px; }
        .required-star { color: #ef4444; margin-left: 2px; }
        .error-field { border-color: #ef4444 !important; background-color: #fff1f2 !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="saveToast" class="fixed bottom-10 right-10 bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold shadow-2xl hidden z-50">✓ Progrés desat</div>

    <div class="max-w-[1850px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10">
        
        <div class="space-y-4">
            <header class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 class="text-2xl font-black italic text-indigo-900">Guia d'Elaboració CdS</h1>
                        <p class="text-slate-500 font-bold text-[10px] uppercase tracking-widest">Treball final del Postgrau Govern Obert i Transformació Digital</p>
                    </div>
                    <button onclick="saveManual()" class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md">💾 Desar</button>
                </div>
                <div class="flex items-end gap-3 pt-3 border-t mt-4">
                    <div class="flex flex-col flex-grow">
                        <label class="text-[9px] font-bold text-slate-400 uppercase">Carta activa</label>
                        <input type="text" id="projNameInput" oninput="renameProject()" class="text-sm p-2 rounded-xl border bg-slate-50 outline-none font-bold text-indigo-700">
                    </div>
                    <select id="projectSelector" onchange="switchProject()" class="text-sm p-2 rounded-xl border bg-white outline-none w-40 font-semibold"></select>
                    <div class="flex gap-1">
                        <button onclick="createNewProject()" class="bg-indigo-600 text-white p-2 rounded-xl hover:bg-indigo-700 transition text-xs font-bold px-3">➕ Nova</button>
                        <button onclick="deleteProject()" class="bg-red-500 text-white p-2 rounded-xl hover:bg-red-600 transition text-xs font-bold px-3">🗑️</button>
                    </div>
                </div>
            </header>

            <nav class="flex overflow-x-auto gap-2 bg-white p-2 rounded-2xl shadow-sm">
                <button onclick="setStep(1)" id="nav1" class="px-4 py-2 text-[9px] uppercase font-bold step-active whitespace-nowrap">1. Dades</button>
                <button onclick="setStep(2)" id="nav2" class="px-4 py-2 text-[9px] uppercase font-bold text-slate-400 whitespace-nowrap">2. Gestió</button>
                <button onclick="setStep(3)" id="nav3" class="px-4 py-2 text-[9px] uppercase font-bold text-slate-400 whitespace-nowrap">3. Serveis</button>
                <button onclick="setStep(4)" id="nav4" class="px-4 py-2 text-[9px] uppercase font-bold text-slate-400 whitespace-nowrap">4. Qualitat</button>
                <button onclick="setStep(5)" id="nav5" class="px-4 py-2 text-[9px] uppercase font-bold text-slate-400 whitespace-nowrap">5. Drets</button>
                <button onclick="setStep(6)" id="nav6" class="px-4 py-2 text-[9px] uppercase font-bold text-slate-400 whitespace-nowrap">6. Canals</button>
            </nav>

            <div class="bg-white p-8 rounded-3xl shadow-sm border min-h-[500px] flex flex-col justify-between">
                <div id="editor" class="space-y-6"></div>
                <div class="flex justify-between mt-8 border-t pt-6">
                    <button onclick="move(-1)" class="text-slate-400 font-bold text-sm">Anterior</button>
                    <button id="btnNext" onclick="move(1)" class="bg-indigo-600 text-white px-10 py-2 rounded-xl font-bold shadow-lg">Següent Pas</button>
                </div>
            </div>
            <button onclick="exportDoc()" class="w-full bg-slate-900 text-white py-4 rounded-3xl font-black uppercase tracking-widest hover:bg-black transition shadow-xl">📥 Descarregar document</button>
        </div>

        <div class="sticky top-8 h-[90vh] overflow-y-auto">
            <div id="preview" class="document-page"></div>
        </div>
    </div>

    <script>
        let step = 1;
        const DEFAULT_COMPROMISOS_TEXT = "Els compromisos d’aquesta carta s’apliquen sempre que els serveis funcionin amb normalitat. Això vol dir que no es poden garantir si hi ha situacions imprevistes o de força major que afectin el funcionament del servei.";
        const DEFAULT_INCOMPL_TEXT = "Si consideres que un compromís no s’ha complert, pots presentar una queixa específica pels canals especificats a l’apartat 6.2. Des de l’Ajuntament, activarem les mesures de reparació o correcció següents: et demanarem disculpes, t’explicarem què ha passat i t’informarem de quines mesures prendrem perquè no torni a passar; si és possible, t’oferirem una alternativa.";
        const DEFAULT_NORMA_GEN = "En l’actuació administrativa, la Llei 26/2010, del 3 d’agost, de règim jurídic i de procediment de les administracions públiques de Catalunya (articles 21-30). Els drets de les persones en les seves relacions amb les administracions públiques que preveu la Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques (article 13).";

        const CFG = {
            1: { t: "1. Dades identificatives de la carta", f: [
                { id: 'nServ', l: 'Nom del servei objecte de la carta', ob: true, h: 'Exemple: Biblioteca Municipal, Serveis Socials.' },
                { id: 'nMun', l: 'Nom del municipi', ob: true },
                { id: 'aprov', l: 'Òrgan d’aprovació', ob: false, h: 'No és necessari fins a disposar de la informació. Ex: Decret d’Alcaldia o Acord del Ple.' },
                { id: 'dAprov', l: 'Data d’aprovació', ob: false },
                { id: 'link', l: 'Enllaç Portal Transparència', ob: true },
                { id: 'uResp', l: 'Òrgan o unitat responsable', ob: true }
            ]},
            2: { t: "2. Organització i forma de gestió dels serveis", f: [
                { id: 'uPre', l: '2.1. Unitat prestadora dels serveis', ob: true, r: 'En el cas de serveis de gestió indirecta, cal tenir present els plecs de contractació o la normativa específica.', h: 'Qui gestiona directament el servei.' },
                { id: 'descOrg', l: 'Descripció orgànica', ob: true, h: 'Breu explicació de l’estructura interna. Exemple: "La unitat de medi ambient s’estructura en dos departaments: gestió de residus i parcs i jardins. Depèn directament de la gerència d’urbanisme".' },
                { id: 'regResp', l: 'Regidoria responsable', ob: true },
                { id: 'respArea', l: 'Responsable de l’àrea / cap del servei', ob: true }
            ]},
            3: { t: "3. Serveis que t’oferim", f: [
                { id: 'miss', l: '3.1. Missió del servei', ob: true, h: 'Exemple: Gestionar les demandes ciutadanes amb eficàcia i proximitat.' },
                { id: 'lServ', l: 'Llista de serveis finalistes', ob: true, h: 'Llista dels serveis concrets que rep el ciutadà.' },
                { id: 'dest', l: '3.2. Destinataris dels serveis', ob: true },
                { id: 'condAcc', l: 'Condicions d’accés', ob: true },
                { id: 'canalsP', l: '3.3. Canals de prestació', ob: false },
                { id: 'regEco', l: '3.4. Quin és el règim econòmic?', ob: true },
                { id: 'norma', l: '3.5. Normativa aplicable', ob: false }
            ]},
            4: { t: "4. Els nostres compromisos de qualitat", isC: true, f: [
                { id: 'introComp', l: 'Presentació de compromisos', ob: true, r: 'En el cas de serveis de gestió indirecta, cal tenir present plecs o normativa.', h: 'Text obligatori sobre la garantia del funcionament normal.' },
                { id: 'perAva', l: '4.2. Període d’avaluació', ob: true },
                { id: 'linkAva', l: 'Enllaç publicació informes', ob: true }
            ]},
            5: { t: "5. Drets i deures", f: [
                { id: 'dretsEsp', l: '5.1. Quins drets tens?', ob: true },
                { id: 'deuresEsp', l: '5.2. Quins deures tens?', ob: true },
                { id: 'normaGen', l: '5.3. Drets generals', ob: false },
                { id: 'incompl', l: '5.4. Mesures en cas d’incompliment', ob: true }
            ]},
            6: { t: "6. Consultes, queixes i suggeriments", f: [
                { id: 'cCTel', l: '6.1. Consultes: Canal Telemàtic', ob: true }, { id: 'cCTlf', l: '6.1. Consultes: Telèfon', ob: true }, { id: 'cCPres', l: '6.1. Consultes: Presencial', ob: true }, { id: 'tCDies', l: 'Termini resposta consultes', ob: true },
                { id: 'cQTel', l: '6.2. Queixes: Canal Telemàtic', ob: true }, { id: 'cQPres', l: '6.2. Queixes: Presencial', ob: true }, { id: 'tQDies', l: 'Temps de resposta', ob: true, h: 'Ex: 15 dies naturals.' }, { id: 'cQRes', l: 'Persona que resoldrà', ob: true },
                { id: 'millora', l: '6.3. Com millorar?', ob: false }
            ]}
        };

        let projs = JSON.parse(localStorage.getItem('cds_vFinal_Gold')) || { "Proposta inicial": newData() };
        let curProj = localStorage.getItem('cds_vGold_Cur') || "Proposta inicial";
        let d = projs[curProj];

        function newData() {
            return {
                nServ: "", nMun: "", aprov: "", dAprov: "", link: "", uResp: "",
                uPre: "", descOrg: "", regResp: "", respArea: "", miss: "", lServ: "",
                dest: "", condAcc: "", canalsP: "", regEco: "", norma: "", 
                introComp: DEFAULT_COMPROMISOS_TEXT,
                perAva: "", linkAva: "", comps: [], incompl: DEFAULT_INCOMPL_TEXT, 
                normaGen: DEFAULT_NORMA_GEN,
                dretsEsp: "", deuresEsp: "", cCTel: "", cCTlf: "", cCPres: "", tCDies: "", cQTel: "", cQPres: "", tQDies: "", cQRes: "", millora: ""
            };
        }

        function toggleHelp(id) {
            const block = document.getElementById('help-' + id);
            block.style.display = block.style.display === 'block' ? 'none' : 'block';
        }

        function setStep(s) { step = s; renderEditor(); updatePreview(); window.scrollTo(0,0); }

        function renderEditor() {
            const sec = CFG[step];
            const area = document.getElementById('editor');
            area.innerHTML = `<h2 class="text-xl font-black mb-4 text-indigo-900">${sec.t}</h2>`;
            
            if (sec.isC) {
                // ENLLAÇ ACTUALITZAT AMB LA NOVA URL REQUERIDA
                area.innerHTML += `<div class="bg-blue-50 p-4 rounded-xl mb-6 text-[11px] text-blue-800 leading-relaxed"><b>Suport:</b> Fes servir l'<b><a href="https://qualyteam45.github.io/EinaBancIndicadors/" target="_blank" class="underline font-bold">Eina de redacció de compromisos i indicadors - GOiTD</a></b>.</div>`;
                d.comps.forEach((c, i) => {
                    area.innerHTML += `<div class="p-4 bg-slate-50 rounded-2xl border mb-3 relative">
                        <textarea oninput="uC(${i},'t',this.value)" class="w-full p-2 border rounded-lg text-xs mb-2" placeholder="Compromís">${c.t}</textarea>
                        <textarea oninput="uC(${i},'i',this.value)" class="w-full p-2 border rounded-lg text-[10px]" placeholder="Indicador">${c.i}</textarea>
                        <button onclick="remC(${i})" class="absolute top-1 right-2 text-red-300">✕</button>
                    </div>`;
                });
                area.innerHTML += `<button onclick="addC()" class="w-full py-2 border-2 border-dashed rounded-xl text-slate-400 text-[10px] font-bold mb-4">+ Afegir compromís</button>`;
            }
            
            sec.f.forEach(f => {
                area.innerHTML += `
                    <div class="mb-4">
                        <div class="flex items-center">
                            <label class="block text-[10px] font-bold text-slate-500 uppercase">${f.l}${f.ob ? '<span class="required-star">*</span>' : ''}</label>
                            ${f.h ? `<span class="info-btn" onclick="toggleHelp('${f.id}')">Ajuda i exemple</span>` : ''}
                        </div>
                        <div id="help-${f.id}" class="help-block text-[11px] text-slate-700 mb-2">💡 ${f.h}</div>
                        <textarea id="in-${f.id}" oninput="uV('${f.id}')" class="w-full mt-1 p-3 bg-white rounded-xl border border-slate-200 outline-none text-xs focus:ring-2 focus:ring-indigo-100 transition" rows="3">${d[f.id] || ''}</textarea>
                        ${f.r ? `<div class="red-flag"><p class="text-[10px] text-red-600 font-bold uppercase">🚩 Atenció:</p><p class="text-[10px] text-red-700 italic">${f.r}</p></div>` : ''}
                    </div>`;
            });

            for(let i=1; i<=6; i++) document.getElementById('nav'+i).className = `px-4 py-2 text-[9px] uppercase font-bold whitespace-nowrap ${i===step?'step-active':'text-slate-400'}`;
        }

        function uV(id) { d[id] = document.getElementById('in-'+id).value; sav(); updatePreview(); }
        function uC(idx, k, v) { d.comps[idx][k] = v; sav(); updatePreview(); }
        function addC() { d.comps.push({t:"", i:""}); renderEditor(); updatePreview(); }
        function remC(idx) { d.comps.splice(idx, 1); renderEditor(); updatePreview(); }
        function sav() { projs[curProj] = d; localStorage.setItem('cds_vFinal_Gold', JSON.stringify(projs)); localStorage.setItem('cds_vGold_Cur', curProj); }
        function saveManual() { sav(); document.getElementById('saveToast').classList.remove('hidden'); setTimeout(()=>document.getElementById('saveToast').classList.add('hidden'), 2000); }
        
        function move(n) { 
            if (n === 1) {
                let valid = true;
                CFG[step].f.forEach(f => { if(f.ob && (!d[f.id] || d[f.id].trim()==="")) valid = false; });
                if(!valid) { alert("Ompli els camps obligatoris (*)."); return; }
            }
            step += n; if(step<1)step=1; if(step>6)step=6; setStep(step); 
        }

        function updatePreview() {
            const cHtml = d.comps.length > 0 ? d.comps.map(c => `<tr><td style="border:1px solid black;padding:8px">${c.t}</td><td style="border:1px solid black;padding:8px">${c.i}</td></tr>`).join('') : '<tr><td style="border:1px solid black;padding:8px">...</td><td style="border:1px solid black;padding:8px">...</td></tr>';

            document.getElementById('preview').innerHTML = `
                <div style="text-align:center; font-weight:bold; font-size:14pt; text-transform:uppercase; margin-bottom:10px">CARTA DE SERVEIS DE <span class="yellow-field">${d.nServ||'[NOM DEL SERVEI]'}</span></div>
                <div style="text-align:center; font-weight:bold; font-size:14pt; text-transform:uppercase; margin-bottom:40px">AJUNTAMENT DE <span class="yellow-field">${d.nMun||'[NOM DEL MUNICIPI]'}</span></div>

                <p><strong>1. Dades identificatives de la carta:</strong></p>
                <p>La carta de serveis que es presenta a continuació recull els serveis de <span class="yellow-field">${d.nServ||'...'}</span>, els compromisos de qualitat, els teus drets i deures, i les vies per presentar suggeriments i queixes.</p>
                <p>Està aprovada per <span class="yellow-field">${d.aprov||'...'}</span> en data <span class="yellow-field">${d.dAprov||'...'}</span>, i està publicada al Portal de transparència de l’Ajuntament <span class="yellow-field">${d.link||'...'}</span>.</p>
                <p>L’òrgan responsable d’aquesta carta de serveis és <span class="yellow-field">${d.uResp||'...'}</span>.</p>

                <p><strong>2. Organització i forma de gestió dels serveis:</strong></p>
                <p style="font-weight:bold">2.1. Qui som, què fem i com ho fem?</p>
                <p>La prestació dels serveis de la carta és responsabilitat de <span class="yellow-field">${d.uPre||'...'}</span>, que gestiona el servei. <span class="yellow-field">${d.descOrg||'...'}</span>. Regidoria responsable: <span class="yellow-field">${d.regResp||'...'}</span>. Responsable: <span class="yellow-field">${d.respArea||'...'}</span>.</p>

                <p><strong>3. Serveis que t’oferim:</strong></p>
                <p style="font-weight:bold">3.1. Quins serveis t’oferim?</p>
                <p><span class="yellow-field">${d.uPre||'...'}</span> té com a missió <span class="yellow-field">${d.miss||'...'}</span>. T’oferim els serveis següents: <span class="yellow-field" style="white-space:pre-line">${d.lServ||'...'}</span>.</p>
                <p style="font-weight:bold">3.2. A qui van dirigits i quines condicions d’accés hi ha?</p>
                <p><span class="yellow-field">${d.dest||'...'}</span>. <span class="yellow-field">${d.condAcc||'...'}</span>.</p>
                <p style="font-weight:bold">3.3. Per quins canals els prestem?</p>
                <p><span class="yellow-field" style="white-space:pre-line">${d.canalsP||'...'}</span></p>
                <p style="font-weight:bold">3.4. Quin és el règim econòmic?</p>
                <p><span class="yellow-field" style="white-space:pre-line">${d.regEco||'...'}</span></p>
                <p style="font-weight:bold">3.5. Normativa</p>
                <p><span class="yellow-field">${d.norma||'...'}</span></p>

                <p><strong>4. Els nostres compromisos de qualitat:</strong></p>
                <p><span class="yellow-field" style="white-space:pre-line">${d.introComp}</span></p>
                <p style="font-weight:bold">4.1. Quins compromisos assumim i com es mesura el compliment?</p>
                <table style="width:100%; border-collapse:collapse; margin:10px 0">
                    <tr style="background:#f3f4f6"><th style="border:1px solid black;padding:8px">Compromís de qualitat</th><th style="border:1px solid black;padding:8px">Indicador de compliment</th></tr>
                    ${cHtml}
                </table>
                <p style="font-weight:bold">4.2. Com s’avalua el moralment el compliment dels compromisos?</p>
                <p>L’avaluació d’aquesta carta de serveis s’ha de realitzar cada <span class="yellow-field">${d.perAva||'...'}</span> i els informes d’avaluació s’han de publicar a l’espai web <span class="yellow-field">${d.linkAva||'...'}</span>.</p>

                <p><strong>5. Drets i deures:</strong></p>
                <p><strong>5.1. Drets:</strong> <span class="yellow-field">${d.dretsEsp||'...'}</span>. <strong>5.2. Deures:</strong> <span class="yellow-field">${d.deuresEsp||'...'}</span>.</p>
                <p><strong>5.3. Drets generals:</strong> <span class="yellow-field">${d.normaGen}</span>.</p>
                <p><strong>5.4. Incompliment:</strong> <span class="yellow-field">${d.incompl}</span>.</p>

                <p><strong>6. Consultes, queixes i suggeriments:</strong></p>
                <p><strong>6.1. Consultes:</strong> Canal telemàtic (<span class="yellow-field">${d.cCTel||'...'}</span>), telefònic (<span class="yellow-field">${d.cCTlf||'...'}</span>), presencial (<span class="yellow-field">${d.cCPres||'...'}</span>). Resposta en <span class="yellow-field">${d.tCDies||'...'}</span> dies.</p>
                <p><strong>6.2. Queixes:</strong> Canal telemàtic (<span class="yellow-field">${d.cQTel||'...'}</span>). Temps de resposta: <span class="yellow-field">${d.tQDies||'...'}</span> per <span class="yellow-field">${d.cQRes||'...'}</span>.</p>
                <p><strong>6.3. Millora:</strong> <span class="yellow-field">${d.millora||'...'}</span></p>
            `;
        }

        function createNewProject() { const n = prompt("Nom:"); if(n) { projs[n] = newData(); curProj = n; d = projs[n]; updateProjSel(); setStep(1); } }
        function deleteProject() { if(Object.keys(projs).length > 1 && confirm("Eliminar?")) { delete projs[curProj]; curProj = Object.keys(projs)[0]; d = projs[curProj]; updateProjSel(); setStep(1); } }
        function switchProject() { curProj = document.getElementById('projectSelector').value; d = projs[curProj]; updateProjSel(); setStep(1); }
        function renameProject() { const v = document.getElementById('projNameInput').value; if(v && v!==curProj) { projs[v] = d; delete projs[curProj]; curProj = v; updateProjSel(); } }
        function updateProjSel() {
            document.getElementById('projectSelector').innerHTML = Object.keys(projs).map(p => `<option value="${p}" ${p===curProj?'selected' : ''}>${p}</option>`).join('');
            document.getElementById('projNameInput').value = curProj;
        }

        updateProjSel(); setStep(1);
    </script>
</body>
</html>
